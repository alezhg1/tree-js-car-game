<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamborghini - Fixed Collisions</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }

        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #333; font-family: sans-serif; font-size: 20px;
            font-weight: bold; pointer-events: none;
            background: rgba(255,255,255,0.9); padding: 20px; border-radius: 8px; z-index: 10;
        }

        #coords {
            position: absolute; top: 20px; right: 20px;
            color: #000; font-family: 'Courier New', monospace; font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 12px; border-radius: 4px;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;
            font-weight: bold;
        }

        #speedometer-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 220px;
            height: 220px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            overflow: hidden;
        }

        .gauge-bg {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 15px solid rgba(255, 255, 255, 0.1);
            border-top-color: transparent;
            border-right-color: transparent;
            transform: rotate(135deg);
        }

        .gauge-fill {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 15px solid transparent;
            border-top-color: #ff3333;
            border-right-color: #ff3333;
            transform: rotate(135deg);
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 0 5px #ff3333);
            z-index: 1;
        }

        .speed-value {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 2;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            z-index: 2;
        }

        .gear-indicator {
            position: absolute;
            top: 25%;
            font-size: 24px;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 8px #ff3333;
            z-index: 2;
        }

        .ticks {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 135deg,
                transparent 0deg,
                rgba(255,255,255,0.5) 2deg,
                transparent 3deg,
                transparent 45deg,
                rgba(255,255,255,0.3) 47deg,
                transparent 48deg,
                transparent 90deg,
                rgba(255,255,255,0.2) 92deg,
                transparent 93deg,
                transparent 135deg,
                transparent 225deg,
                transparent 315deg
            );
            border-radius: 50%;
            z-index: 0;
            opacity: 0.5;
        }
    </style>
    <link rel="icon" href="data:;base64,=">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Загрузка...</div>

    <div id="coords">X: 0.00 | Y: 0.00 | Z: 0.00</div>

    <div id="speedometer-container">
        <div class="ticks"></div>
        <div class="gauge-bg"></div>
        <div class="gauge-fill" id="gauge-fill"></div>
        <div class="gear-indicator" id="gear-display">N</div>
        <div class="speed-value" id="speed-value">0</div>
        <div class="speed-unit">км/ч</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const TELEPORT_TO_TENT = true;
        const TARGET_POS = { x: 25.63, y: 0.22, z: 37.62 };

        const CAR_CONFIG = {
            maxSpeed: 0.05,
            reverseSpeed: 0.03,
            acceleration: 0.0008,
            friction: 0.995,
            brakeForce: 0.002,
            turnSpeed: 0.017,
            collisionDistance: 0.6 // Уменьшено с 1.2 до 0.6 (короткий бампер)
        };

        const CAMERA_CONFIG = {
            distance: 0.7,
            height: 0.35,
            lerpPosition: 0.1,
            lerpLookAt: 0.02
        };

        const keys = { w: false, a: false, s: false, d: false };
        let speed = 0;
        let assetsLoaded = 0;
        const totalAssets = 2;

        const raycaster = new THREE.Raycaster();
        const downVector = new THREE.Vector3(0, -1, 0);
        const carPosition = new THREE.Vector3();
        let isTrackLoaded = false;
        let carCenterHeight = 0;
        let carTotalHeight = 0;

        const _v3CameraOffset = new THREE.Vector3();
        const _v3LookAt = new THREE.Vector3(0, 1, 0);
        const _v3LightPos = new THREE.Vector3();
        const _currentLookAt = new THREE.Vector3(0, 0.5, 0);

        const _v3Forward = new THREE.Vector3();
        const _v3Right = new THREE.Vector3();

        const speedValueEl = document.getElementById('speed-value');
        const gaugeFillEl = document.getElementById('gauge-fill');
        const gearDisplayEl = document.getElementById('gear-display');
        const coordsElement = document.getElementById('coords');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 100, 600);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({
            antialias: false,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const carContainer = new THREE.Group();
        scene.add(carContainer);
        let trackModel = null;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffee, 1.8);
        sunLight.castShadow = true;

        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;

        const shadowSize = 80;
        sunLight.shadow.camera.left = -shadowSize;
        sunLight.shadow.camera.right = shadowSize;
        sunLight.shadow.camera.top = shadowSize;
        sunLight.shadow.camera.bottom = -shadowSize;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 200;
        scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x333333, 0.4);
        scene.add(hemiLight);

        function checkLoading() {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) {
                document.getElementById('loading').style.display = 'none';
                isTrackLoaded = true;

                if (TELEPORT_TO_TENT) {
                    carContainer.position.set(TARGET_POS.x, TARGET_POS.y, TARGET_POS.z);
                    carContainer.rotation.y = Math.PI;
                    _currentLookAt.set(0, 0.5, 0).applyMatrix4(carContainer.matrixWorld);
                    speed = 0;
                } else {
                    alignCarToTrack();
                }
            }
        }

        function loadTrack() {
            const loader = new GLTFLoader();
            loader.load('./track/scene.gltf', (gltf) => {
                trackModel = gltf.scene;
                trackModel.scale.set(20, 20, 20);
                trackModel.updateMatrixWorld(true);

                trackModel.traverse((child) => {
                    if (child.isMesh) {
                        child.receiveShadow = true;
                        child.castShadow = true;
                    }
                });

                scene.add(trackModel);
                checkLoading();
            }, undefined, (err) => console.error(err));
        }

        function loadCar() {
            const loader = new GLTFLoader();
            loader.load('./scene.gltf', (gltf) => {
                const model = gltf.scene;
                model.scale.set(14, 14, 14);

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const height = box.max.y - box.min.y;
                carCenterHeight = height / 2;
                carTotalHeight = height;

                model.position.x -= center.x;
                model.position.z -= center.z;
                model.position.y -= box.min.y;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                carContainer.add(model);
                checkLoading();
            }, undefined, (err) => console.error(err));
        }

        loadTrack();
        loadCar();

        function checkCollisions(moveDirection) {
            if (!isTrackLoaded || !trackModel) return false;

            const origin = carContainer.position.clone();
            origin.y += carCenterHeight * 0.5;

            // Пускаем луч только в сторону движения
            const direction = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carContainer.rotation.y);

            // Если движемся назад, инвертируем луч
            if (moveDirection < 0) {
                direction.negate();
            }

            raycaster.set(origin, direction);
            const intersects = raycaster.intersectObject(trackModel, true);

            // Проверка: есть ли препятствие ближе чем 0.6 единиц
            if (intersects.length > 0 && intersects[0].distance < CAR_CONFIG.collisionDistance) {
                return true;
            }
            return false;
        }

        function alignCarToTrack() {
            if (!isTrackLoaded || !trackModel) return;

            const currentY = carContainer.position.y;

            carPosition.copy(carContainer.position);
            carPosition.y += (carCenterHeight * 0.5);

            raycaster.set(carPosition, downVector);

            const maxDistance = 2.5;
            const intersects = raycaster.intersectObject(trackModel, true);

            let foundGround = false;
            let groundY = currentY;

            if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.distance <= maxDistance) {
                    if (hit.point.y < currentY) {
                        groundY = hit.point.y + carCenterHeight - 0.05;
                        foundGround = true;
                    }
                }
            }

            let calculatedY = currentY;

            if (foundGround) {
                calculatedY = groundY;
            } else {
                if (currentY > 0) {
                     calculatedY = currentY - 0.05;
                }
            }

            const x = carContainer.position.x;
            const z = carContainer.position.z;
            if (x > 5 && x < 30 && z > 25 && z < 50) {
                const MAX_HEIGHT_IN_TENT = 1.5;
                if (calculatedY > MAX_HEIGHT_IN_TENT) {
                    calculatedY = MAX_HEIGHT_IN_TENT;
                }
            }

            carContainer.position.y = calculatedY;
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k==='w'||k==='ц') keys.w=true;
            if(k==='s'||k==='ы') keys.s=true;
            if(k==='a'||k==='ф') keys.a=true;
            if(k==='d'||k==='в') keys.d=true;
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k==='w'||k==='ц') keys.w=false;
            if(k==='s'||k==='ы') keys.s=false;
            if(k==='a'||k==='ф') keys.a=false;
            if(k==='d'||k==='в') keys.d=false;
        });

        function updateCarPhysics() {
            let desiredSpeedChange = 0;
            let movingForward = false;
            let movingBackward = false;

            // Определяем намерение движения
            if (keys.w) {
                desiredSpeedChange = CAR_CONFIG.acceleration;
                movingForward = true;
            } else if (keys.s) {
                if (speed > 0.002) { desiredSpeedChange = -CAR_CONFIG.brakeForce; }
                else if (speed < -0.002) { desiredSpeedChange = CAR_CONFIG.brakeForce; }
                else {
                    desiredSpeedChange = -CAR_CONFIG.acceleration * 0.5;
                    movingBackward = true;
                }
            } else {
                speed *= CAR_CONFIG.friction;
                if (Math.abs(speed) < 0.0001) speed = 0;
            }

            // ПРОВЕРКА СТОЛКНОВЕНИЙ ТОЛЬКО ПРИ НАЖАТИИ ГАЗА
            let collisionDetected = false;

            if (movingForward) {
                if (checkCollisions(1)) collisionDetected = true;
            } else if (movingBackward && speed >= 0) {
                // Проверяем назад только если начинаем движение назад
                if (checkCollisions(-1)) collisionDetected = true;
            } else if (speed > 0.001) {
                 // Если уже едем вперед по инерции
                 if (checkCollisions(1)) collisionDetected = true;
            } else if (speed < -0.001) {
                 // Если уже едем назад по инерции
                 if (checkCollisions(-1)) collisionDetected = true;
            }

            if (collisionDetected) {
                speed = 0; // Останавливаем

                // Небольшой откат назад, чтобы не застрять в текстуре
                const pushBackDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carContainer.rotation.y);
                if (movingForward || speed > 0) {
                    carContainer.translateZ(-0.05);
                } else {
                    carContainer.translateZ(0.05);
                }

                return;
            }

            // Применяем скорость если нет коллизии
            if (keys.w) speed += desiredSpeedChange;
            else if (keys.s) {
                 // Логика тормоза/заднего хода уже просчитана в desiredSpeedChange, но применим аккуратно
                 if (speed > 0.002) speed -= CAR_CONFIG.brakeForce;
                 else if (speed < -0.002) speed += CAR_CONFIG.brakeForce;
                 else if (keys.s) speed -= CAR_CONFIG.acceleration * 0.5;
            }

            // Ограничения скорости
            if (speed > CAR_CONFIG.maxSpeed) speed = CAR_CONFIG.maxSpeed;
            if (speed < -CAR_CONFIG.reverseSpeed) speed = -CAR_CONFIG.reverseSpeed;

            // Повороты
            if (Math.abs(speed) > 0.0005) {
                const dir = speed > 0 ? 1 : -1;
                if (keys.a) carContainer.rotation.y += CAR_CONFIG.turnSpeed * dir;
                if (keys.d) carContainer.rotation.y -= CAR_CONFIG.turnSpeed * dir;
            }

            carContainer.translateZ(speed);
        }

        function updateCameraAndLight() {
            _v3LightPos.copy(carContainer.position).add(new THREE.Vector3(40, 100, 40));
            sunLight.position.copy(_v3LightPos);
            sunLight.target = carContainer;
            sunLight.target.updateMatrixWorld();

            _v3CameraOffset.set(0, CAMERA_CONFIG.height, -CAMERA_CONFIG.distance);
            _v3CameraOffset.applyMatrix4(carContainer.matrixWorld);

            camera.position.lerp(_v3CameraOffset, CAMERA_CONFIG.lerpPosition);

            const targetLookAt = new THREE.Vector3(0, 0.5, 30);
            targetLookAt.applyMatrix4(carContainer.matrixWorld);

            _currentLookAt.lerp(targetLookAt, CAMERA_CONFIG.lerpLookAt);

            camera.lookAt(_currentLookAt);
        }

        function updateSpeedometer() {
            const maxGameSpeed = CAR_CONFIG.maxSpeed;
            const kmh = Math.abs((speed / maxGameSpeed) * 70);

            speedValueEl.innerText = Math.floor(kmh);

            if (speed === 0) {
                gearDisplayEl.innerText = 'N';
                gearDisplayEl.style.color = '#aaa';
            } else if (speed > 0) {
                if (kmh < 20) gearDisplayEl.innerText = '1';
                else if (kmh < 40) gearDisplayEl.innerText = '2';
                else if (kmh < 55) gearDisplayEl.innerText = '3';
                else gearDisplayEl.innerText = '4';
                gearDisplayEl.style.color = '#ff3333';
            } else {
                gearDisplayEl.innerText = 'R';
                gearDisplayEl.style.color = '#ffaa00';
            }

            const normalizedSpeed = Math.min(kmh / 70, 1);
            const rotation = 135 + (normalizedSpeed * 270);
            gaugeFillEl.style.transform = `rotate(${rotation}deg)`;

            if (normalizedSpeed > 0.85) {
                gaugeFillEl.style.borderTopColor = '#ff0000';
                gaugeFillEl.style.borderRightColor = '#ff0000';
                gaugeFillEl.style.filter = 'drop-shadow(0 0 10px #ff0000)';
                speedValueEl.style.color = '#ff0000';
            } else {
                gaugeFillEl.style.borderTopColor = '#ff3333';
                gaugeFillEl.style.borderRightColor = '#ff3333';
                gaugeFillEl.style.filter = 'drop-shadow(0 0 5px #ff3333)';
                speedValueEl.style.color = '#fff';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateCarPhysics();
            alignCarToTrack();
            updateCameraAndLight();
            updateSpeedometer();

            const x = carContainer.position.x.toFixed(2);
            const y = carContainer.position.y.toFixed(2);
            const z = carContainer.position.z.toFixed(2);
            coordsElement.innerText = `X: ${x} | Y: ${y} | Z: ${z}`;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
