<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamborghini - Teleport to Tent</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #333; font-family: sans-serif; font-size: 20px;
            font-weight: bold; pointer-events: none;
            background: rgba(255,255,255,0.9); padding: 20px; border-radius: 8px; z-index: 10;
        }
        #info {
            position: absolute; bottom: 20px; left: 20px;
            color: #333; font-family: sans-serif; font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px; border-radius: 4px;
            pointer-events: none; line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;
            user-select: none;
        }
        #coords {
            position: absolute; top: 20px; right: 20px;
            color: #000; font-family: 'Courier New', monospace; font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px; border-radius: 4px;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;
            font-weight: bold;
        }
        .key {
            display: inline-block; background: #fff;
            padding: 2px 6px; border-radius: 3px;
            border: 1px solid #ccc; font-weight: bold; color: #333;
        }
    </style>
    <link rel="icon" href="data:;base64,=">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Телепортация к палатке...</div>

    <div id="coords">X: 0.00 | Y: 0.00 | Z: 0.00</div>

    <div id="info">
        <div><span class="key">W</span> Газ &nbsp; <span class="key">S</span> Тормоз</div>
        <div style="margin-top:5px;"><span class="key">A</span> Влево &nbsp; <span class="key">D</span> Вправо</div>
        <div style="margin-top:5px; font-size: 12px; color: #d9534f; font-weight: bold;">
            МАШИНА ТЕЛЕПОРТИРОВАНА НА КООРДИНАТЫ ПАЛАТКИ
        </div>
        <div style="font-size: 11px; color: #666;">
            Чтобы отключить, найдите в коде строку: const TELEPORT_TO_TENT = true;
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- НАСТРОЙКА ТЕЛЕПОРТА ---
        const TELEPORT_TO_TENT = true; // Поставьте false, чтобы убрать телепорт
        const TARGET_POS = { x: 25.63, y: 0.22, z: 37.62 }; // Ваши координаты

        const CAR_CONFIG = {
            maxSpeed: 0.4,
            reverseSpeed: 0.3,
            acceleration: 0.01,
            friction: 0.96,
            brakeForce: 0.015,
            turnSpeed: 0.06
        };

        const CAMERA_CONFIG = {
            distance: 0.8,
            height: 0.35,
            smoothness: 2
        };

        const keys = { w: false, a: false, s: false, d: false };
        let speed = 0;
        let assetsLoaded = 0;
        const totalAssets = 2;

        const raycaster = new THREE.Raycaster();
        const downVector = new THREE.Vector3(0, -1, 0);
        const carPosition = new THREE.Vector3();
        let isTrackLoaded = false;
        let carCenterHeight = 0;

        const _v3CameraOffset = new THREE.Vector3();
        const _v3LookAt = new THREE.Vector3(0, 1, 0);
        const _v3LightPos = new THREE.Vector3();

        const coordsElement = document.getElementById('coords');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 100, 600);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({
            antialias: false,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const carContainer = new THREE.Group();
        scene.add(carContainer);
        let trackModel = null;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffee, 1.8);
        sunLight.castShadow = true;

        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;

        const shadowSize = 80;
        sunLight.shadow.camera.left = -shadowSize;
        sunLight.shadow.camera.right = shadowSize;
        sunLight.shadow.camera.top = shadowSize;
        sunLight.shadow.camera.bottom = -shadowSize;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 200;
        scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x333333, 0.4);
        scene.add(hemiLight);

        function checkLoading() {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) {
                document.getElementById('loading').style.display = 'none';
                isTrackLoaded = true;

                // ЕСЛИ ВКЛЮЧЕН ТЕЛЕПОРТ
                if (TELEPORT_TO_TENT) {
                    carContainer.position.set(TARGET_POS.x, TARGET_POS.y, TARGET_POS.z);
                    // Сбрасываем скорость, чтобы машина стояла
                    speed = 0;
                    console.log(`Машина телепортирована на: ${TARGET_POS.x}, ${TARGET_POS.y}, ${TARGET_POS.z}`);
                } else {
                    alignCarToTrack();
                }
            }
        }

        function loadTrack() {
            const loader = new GLTFLoader();
            loader.load('./track/scene.gltf', (gltf) => {
                trackModel = gltf.scene;
                trackModel.scale.set(20, 20, 20);
                trackModel.updateMatrixWorld(true);

                trackModel.traverse((child) => {
                    if (child.isMesh) {
                        child.receiveShadow = true;
                        child.castShadow = true;
                    }
                });

                scene.add(trackModel);
                checkLoading();
            }, undefined, (err) => console.error('Ошибка трека:', err));
        }

        function loadCar() {
            const loader = new GLTFLoader();
            loader.load('./scene.gltf', (gltf) => {
                const model = gltf.scene;
                model.scale.set(14, 14, 14);

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const height = box.max.y - box.min.y;
                carCenterHeight = height / 2;

                model.position.x -= center.x;
                model.position.z -= center.z;
                model.position.y -= box.min.y;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                carContainer.add(model);
                checkLoading();
            }, undefined, (err) => console.error('Ошибка машины:', err));
        }

        loadTrack();
        loadCar();

        function alignCarToTrack() {
            if (!isTrackLoaded || !trackModel) return;

            carPosition.copy(carContainer.position);
            carPosition.y += 10;

            raycaster.set(carPosition, downVector);
            const intersects = raycaster.intersectObject(trackModel, true);

            if (intersects.length > 0) {
                carContainer.position.y = intersects[0].point.y + carCenterHeight + 0.05;
            }
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k==='w'||k==='ц') keys.w=true;
            if(k==='s'||k==='ы') keys.s=true;
            if(k==='a'||k==='ф') keys.a=true;
            if(k==='d'||k==='в') keys.d=true;
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k==='w'||k==='ц') keys.w=false;
            if(k==='s'||k==='ы') keys.s=false;
            if(k==='a'||k==='ф') keys.a=false;
            if(k==='d'||k==='в') keys.d=false;
        });

        function updateCarPhysics() {
            if (keys.w) speed += CAR_CONFIG.acceleration;
            else if (keys.s) {
                if (speed > 0.01) { speed -= CAR_CONFIG.brakeForce; if (speed < 0) speed = 0; }
                else if (speed < -0.01) { speed += CAR_CONFIG.brakeForce; if (speed > 0) speed = 0; }
                else { speed -= CAR_CONFIG.acceleration * 0.5; }
            }
            else {
                speed *= CAR_CONFIG.friction;
                if (Math.abs(speed) < 0.001) speed = 0;
            }

            if (speed > CAR_CONFIG.maxSpeed) speed = CAR_CONFIG.maxSpeed;
            if (speed < -CAR_CONFIG.reverseSpeed) speed = -CAR_CONFIG.reverseSpeed;

            if (Math.abs(speed) > 0.005) {
                const dir = speed > 0 ? 1 : -1;
                if (keys.a) carContainer.rotation.y += CAR_CONFIG.turnSpeed * dir;
                if (keys.d) carContainer.rotation.y -= CAR_CONFIG.turnSpeed * dir;
            }
            carContainer.translateZ(speed);
        }

        function updateCameraAndLight() {
            _v3LightPos.copy(carContainer.position).add(new THREE.Vector3(40, 100, 40));
            sunLight.position.copy(_v3LightPos);
            sunLight.target = carContainer;
            sunLight.target.updateMatrixWorld();

            _v3CameraOffset.set(0, CAMERA_CONFIG.height, -CAMERA_CONFIG.distance);
            _v3CameraOffset.applyMatrix4(carContainer.matrixWorld);

            camera.position.copy(_v3CameraOffset);

            _v3LookAt.set(0, 0.5, 0);
            _v3LookAt.applyMatrix4(carContainer.matrixWorld);
            camera.lookAt(_v3LookAt);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Если мы не телепортированы (или уже уехали), продолжаем выравнивать высоту
            if (!TELEPORT_TO_TENT || speed !== 0 || keys.w || keys.s || keys.a || keys.d) {
                 // Можно раскомментировать, если нужно, чтобы после телепорта машина тоже прилипала к земле при движении
                 // alignCarToTrack();
            }

            updateCarPhysics();
            updateCameraAndLight();

            const x = carContainer.position.x.toFixed(2);
            const y = carContainer.position.y.toFixed(2);
            const z = carContainer.position.z.toFixed(2);
            coordsElement.innerText = `X: ${x} | Y: ${y} | Z: ${z}`;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
